name: VinylFever
options:
  bundleIdPrefix: com.jonphillips
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 7MQEE539G9
packages:
  VinylFeverCore:
    path: VinylFeverCore
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.0.0
  sqlite-data:
    url: https://github.com/pointfreeco/sqlite-data
    from: 1.0.0
  swift-navigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: 2.0.0
  LLMClientKit:
    path: ../jon-platform/packages/LLMClientKit
targets:
  VinylFever:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - VinylFever
    dependencies:
      - package: VinylFeverCore
        product: VinylFeverCore
      - package: swift-dependencies
        product: Dependencies
      - package: sqlite-data
        product: SQLiteData
      - package: swift-navigation
        product: SwiftUINavigation
      - package: LLMClientKit
        product: LLMClientKit
    postBuildScripts:
      - name: Build and embed vf-mcp helper
        outputFiles:
          - $(DERIVED_FILE_DIR)/vf-mcp-build
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/vf-mcp
        script: |
          set -euo pipefail
          if [ "$CONFIGURATION" = "Release" ]; then swift_configuration=release; else swift_configuration=debug; fi
          scratch_path="$DERIVED_FILE_DIR/vf-mcp-build"
          swift build --package-path "$SRCROOT/VinylFeverCore" --product vf-mcp --configuration "$swift_configuration" --scratch-path "$scratch_path"
          helper_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helper_dir"
          cp "$scratch_path/$swift_configuration/vf-mcp" "$helper_dir/vf-mcp"
          chmod 755 "$helper_dir/vf-mcp"
    info:
      path: VinylFever/Info.plist
      properties:
        CFBundleDisplayName: Vinyl Fever
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSAppleEventsUsageDescription: Vinyl Fever reads Music library tracks to verify live-show imports.
        NSAppleMusicUsageDescription: Vinyl Fever searches Apple Music and creates playlists in your library.
    settings:
      base:
        # The helper build phase runs SwiftPM against the sibling shared package checkout;
        # Xcode's script sandbox blocks access to those local package sources.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.vinylfever
        PRODUCT_NAME: VinylFever
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: VinylFever/VinylFever.entitlements
        # MusicKit's automatic developer token needs a profile for the explicit App ID that has
        # the MusicKit App Service enabled. Automatic signing picks the wildcard
        # "Mac Team Provisioning Profile: *", and every catalog call then fails with
        # "Failed to request developer token". The profile is created in the developer portal.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 7MQEE539G9
        PROVISIONING_PROFILE_SPECIFIER: Vinyl Fever Dev Profile
  VinylFeverTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - VinylFeverTests
    dependencies:
      # Hosted in the app (BUNDLE_LOADER below) so `@testable import VinylFever` resolves
      # against the host's symbols; `link: false` avoids double-linking the app's code and
      # its VinylFeverCore/Dependencies copies into the test bundle.
      - target: VinylFever
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.VinylFeverTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VinylFever.app/Contents/MacOS/VinylFever"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 7MQEE539G9
schemes:
  VinylFever:
    build:
      targets:
        VinylFever: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VinylFeverTests
